<svg width="100%" viewBox="0 0 780 660" role="img" xmlns="http://www.w3.org/2000/svg">
<title>DGX Spark LLM Stack — current architecture</title>
<desc>Architecture diagram. Hermes Agent is the primary workload: it runs on the host and connects straight to vLLM's published loopback port 8001 using the OpenAI API, bypassing both Nginx and the normalizing shim, with an AWS Bedrock fallback provider used only when the local stack is unreachable. Claude Code sends Anthropic /v1/messages requests over the network through Nginx to a stdlib normalizing shim that hoists system-role messages into the top-level system field before forwarding to vLLM; other OpenAI-compatible clients connect through Nginx straight to vLLM. A single vLLM instance runs Qwen3.6-35B-A3B-NVFP4 with DFlash speculative decoding on a GB10 Grace Blackwell with 128 GB unified memory.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

