# ─────────────────────────────────────────────────────────────────────────────
#  Qwen3.6-35B-A3B-NVFP4 on a GB10 / DGX Spark-class box (128 GB unified).
#
#  The whole stack: vLLM, an Anthropic-compatible shim, and nginx.
#
#      docker compose up -d      # start (needs LLM_API_KEY in .env)
#      docker compose down       # stop
#
#  Every non-default value was measured. The reason is noted next to each flag;
#  TUNING.md has the data, including what was tried and rejected.
#
#  `name:` prefixes the volumes (dgx-llm-stack_vllm-cache, ...). Changing it after
#  the first start leaves the old volumes behind and the compile cache starts cold.
#  The weights are a bind mount of MODEL_PATH and are unaffected.
# ─────────────────────────────────────────────────────────────────────────────
name: dgx-llm-stack

services:

  # ── Qwen3.6-35B-A3B-NVFP4 coding model ───────
  vllm-coding:
    # Built locally from eugr/spark-vllm-docker; needs vLLM 0.26+. Validated build
    # (vLLM 0.30.0, FlashInfer 0.7.1), from eugr/spark-vllm-docker at f7d6e3b:
    #   ./build-and-copy.sh -t vllm-node-v2 --vllm-ref v0.30.0 --apply-preset-vllm-prs -j 8
    # The build reuses this tag. To keep a rollback, run
    # `docker tag vllm-node-v2:latest vllm-node:v2-previous` before rebuilding.
    image: vllm-node-v2:latest
    container_name: vllm-coding
    runtime: nvidia
    restart: "no"         # a crash stays visible; use unless-stopped to survive reboots
    networks:
      - llm-net
    volumes:
      - models:/models
      - huggingface-cache:/root/.cache/huggingface
      # torch.compile and FlashInfer autotune results. Without this volume they
      # live in the container layer, which `compose down` destroys, so every
      # recreate pays ~117s of recompilation.
      - vllm-cache:/root/.cache/vllm
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_LOGGING_LEVEL=WARNING
      - CUDA_MODULE_LOADING=LAZY       # defer CUDA module loads until first use
      # Both models are on local disk (download-models.sh), so nothing needs the
      # Hugging Face hub at runtime. --model must therefore be a local path.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - "python3"
      - "-m"
      - "vllm.entrypoints.openai.api_server"
      # The NVIDIA checkpoint (W4A16, Marlin) beat unsloth's W4A4 + native FP4 by
      # ~16% here: this box is bandwidth-bound, so the smaller file wins. TUNING.md §4.3.
      - "--model"
      - "/models/Qwen3.6-35B-A3B-NVFP4"
      # Clients request this name (your client configs, bench/validate.py,
      # bench/bench.py). Rename it everywhere or not at all.
      - "--served-model-name"
      - "coding"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      # Parallel weight loading. Load path only: cuts startup, not decode speed.
      # (Replaces 0.24's --load-format fastsafetensors, which 0.26+ doesn't have.)
      - "--safetensors-load-strategy"
      - "prefetch"
      # Set above the ~200K window Claude Code assumes, so its compaction fires
      # before the server's limit. TUNING.md §4.6.
      - "--max-model-len"
      - "262144"
      # Unified memory is shared with the OS and every other process; 0.75 leaves
      # headroom for days of uptime. Buys KV capacity, not speed.
      - "--gpu-memory-utilization"
      - "0.75"
      - "--tensor-parallel-size"
      - "1"
      - "--enable-prefix-caching"
      - "--max-num-seqs"
      - "32"
      # vLLM warns that the implicit 2048 starves speculative-decoding draft slots.
      - "--max-num-batched-tokens"
      - "8192"
      # Already vLLM's default for this config; set explicitly so that a future
      # incompatible change fails at startup instead of silently turning it off
      # (the fallback is logged only at INFO, which WARNING hides).
      - "--async-scheduling"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
      - "--language-model-only"    # skip the vision encoder; a coding API never gets images
      # Speculative decoding: DFlash draft model, 4 draft tokens. Worth +44% at c=1
      # over no speculation. The upstream default of 15 was the worst length
      # tested, slower than no speculation at c=4. DFlash beats MTP on tool calls
      # and code edits, and loses slightly on prose. Full sweep: TUNING.md §4.1–4.2.
      # For prose-heavy use, MTP instead:
      #   '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - "--speculative-config"
      - '{"method":"dflash","model":"/models/Qwen3.6-35B-A3B-DFlash","num_speculative_tokens":4}'
    ports:
      # Direct vLLM port, loopback only. No auth, so it must not be reachable
      # from the network; remote clients go through nginx.
      - "127.0.0.1:8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Cold starts measured 341–461s. 600s covers the slowest with margin;
      # nginx and the shim wait for this to pass.
      start_period: 600s

  # ── Anthropic normalizing shim ─────────────────
  # Claude Code puts system-role messages inside messages[]; vLLM's /v1/messages
  # rejects them. This stdlib-only shim moves them into the top-level `system`
  # field and forwards everything else untouched, including `thinking` blocks.
  anthropic-shim:
    image: python:3.12-slim
    container_name: anthropic-shim
    restart: "no"
    networks:
      - llm-net
    volumes:
      - ./shim/shim.py:/app/shim.py:ro
    environment:
      - VLLM_UPSTREAM=http://vllm-coding:8000
    command: ["python3", "/app/shim.py"]
    depends_on:
      vllm-coding:
        condition: service_healthy
    ports:
      # Direct access to the shim for debugging without nginx. Loopback only,
      # for the same reason as 8001.
      - "127.0.0.1:8003:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx reverse proxy ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: "no"
    networks:
      - llm-net
    volumes:
      # A template: the image substitutes ${LLM_API_KEY} into it at startup.
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro       # Optional: add TLS certs here
    environment:
      # Required. Every /coding/ request must carry this key. Compose refuses to
      # start without it, so the API can't come up open by accident.
      - LLM_API_KEY=${LLM_API_KEY:?set LLM_API_KEY in .env (e.g. openssl rand -hex 32)}
    ports:
      # Published on all interfaces so other machines on your LAN can connect.
      # Docker-published ports bypass ufw, so the firewall does not restrict this;
      # the API key and your network boundary do. For same-machine use only,
      # change to "127.0.0.1:80:80".
      - "80:80"
      # - "443:443"    # enable together with the HTTPS block in the template
    depends_on:
      vllm-coding:
        condition: service_healthy
      anthropic-shim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 60s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────
#  Networks & Volumes
# ─────────────────────────────────────────────
networks:
  llm-net:
    driver: bridge

volumes:
  models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_PATH:-/data/models}

  huggingface-cache:
    driver: local

  # torch.compile graphs + FlashInfer autotune configs (~285 MB once warm).
  # Safe to delete to force a clean recompile; it only costs the rebuild time.
  vllm-cache:
    driver: local
